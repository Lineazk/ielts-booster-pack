<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Vocabulary Flashcards</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f0c29;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:1.8rem;margin:20px 0 5px;background:linear-gradient(90deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.subtitle{color:#94a3b8;font-size:.9rem;margin-bottom:20px;text-align:center}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
select,button{padding:8px 16px;border-radius:20px;border:1px solid #a78bfa;background:rgba(167,139,250,.15);color:#fff;cursor:pointer;font-size:.85rem;transition:.3s}
select:hover,button:hover{background:rgba(167,139,250,.35)}
.progress{width:100%;max-width:600px;background:rgba(255,255,255,.1);border-radius:10px;height:6px;margin-bottom:15px}
.progress-bar{height:6px;background:linear-gradient(90deg,#a78bfa,#38bdf8);border-radius:10px;transition:.4s}
.counter{color:#94a3b8;font-size:.85rem;margin-bottom:15px;text-align:center}
.scene{width:100%;max-width:600px;height:380px;perspective:1000px;cursor:pointer;margin-bottom:20px}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.6s}
.card.flipped{transform:rotateY(180deg)}
.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;padding:30px;display:flex;flex-direction:column;justify-content:center}
.front{background:linear-gradient(135deg,rgba(167,139,250,.2),rgba(56,189,248,.1));border:1px solid rgba(167,139,250,.4);align-items:center;text-align:center}
.back{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(167,139,250,.1));border:1px solid rgba(56,189,248,.4);transform:rotateY(180deg)}
.word{font-size:2.2rem;font-weight:700;background:linear-gradient(90deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.pronunciation{color:#94a3b8;font-size:1rem;margin-bottom:8px}
.category-badge{background:rgba(167,139,250,.3);padding:4px 12px;border-radius:20px;font-size:.75rem;color:#c4b5fd}
.hint{color:#64748b;font-size:.8rem;margin-top:15px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.row{margin-bottom:12px}
.label{font-size:.7rem;text-transform:uppercase;color:#a78bfa;letter-spacing:1px;margin-bottom:3px}
.value{font-size:.95rem;color:#e2e8f0}
.bangla{font-size:1.1rem;font-weight:600;color:#38bdf8}
.tip-box{background:rgba(251,191,36,.1);border-left:3px solid #fbbf24;padding:8px 12px;border-radius:0 8px 8px 0;font-size:.85rem;color:#fde68a;margin-top:8px}
.syn{color:#a3e635;font-size:.85rem;font-style:italic}
.nav{display:flex;gap:15px;align-items:center;margin-bottom:15px}
.nav button{padding:10px 24px;border-radius:25px;border:none;font-weight:600;font-size:.9rem}
#prevBtn{background:rgba(148,163,184,.2);color:#94a3b8}
#nextBtn{background:linear-gradient(90deg,#a78bfa,#38bdf8);color:#fff}
#flipBtn{background:rgba(167,139,250,.3);border:1px solid #a78bfa;color:#c4b5fd}
.stars{display:flex;gap:8px;margin-top:10px;justify-content:center}
.star{font-size:1.2rem;cursor:pointer;opacity:.4;transition:.2s}
.star:hover,.star.active{opacity:1}
.sound-btn{background:linear-gradient(135deg,rgba(167,139,250,.4),rgba(56,189,248,.3));border:1px solid rgba(167,139,250,.6);color:#fff;padding:8px 18px;border-radius:20px;cursor:pointer;font-size:.85rem;font-weight:600;transition:.3s;display:inline-flex;align-items:center;gap:7px;margin-top:12px}
.sound-btn:hover{background:linear-gradient(135deg,rgba(167,139,250,.7),rgba(56,189,248,.55));transform:scale(1.05);box-shadow:0 0 18px rgba(167,139,250,.4)}
.sound-btn.playing{animation:soundPulse .6s infinite alternate}
@keyframes soundPulse{from{box-shadow:0 0 8px rgba(167,139,250,.4)}to{box-shadow:0 0 20px rgba(56,189,248,.7)}}
</style>
</head>
<body>
<h1>📚 IELTS Vocabulary Flashcards</h1>
<p class="subtitle">Cambridge IELTS 10-15 | Academic Word List | ক্লিক করুন card flip করতে</p>
<div class="controls">
  <select id="catFilter"><option value="all">সব Category</option></select>
  <button onclick="shuffle()">🔀 Shuffle</button>
  <button onclick="markDone()">✅ জানি</button>
  <button onclick="markAgain()">🔁 আবার দেখব</button>
</div>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div class="counter" id="counter">Card 1 of 1</div>
<div class="scene" onclick="flipCard()">
  <div class="card" id="card">
    <div class="front">
      <div class="category-badge" id="fcat"></div>
      <div class="word" id="fword"></div>
      <div class="pronunciation" id="fpron"></div>
      <div class="stars" id="fstars">
        <span class="star" onclick="rate(event,1)">⭐</span>
        <span class="star" onclick="rate(event,2)">⭐</span>
        <span class="star" onclick="rate(event,3)">⭐</span>
        <span class="star" onclick="rate(event,4)">⭐</span>
        <span class="star" onclick="rate(event,5)">⭐</span>
      </div>
      <div class="hint">👆 click করুন উত্তর দেখতে</div>
      <button class="sound-btn" id="soundBtn" onclick="event.stopPropagation(); playWord()">
        <i class="fa-solid fa-volume-high"></i> Pronunciation শুনুন
      </button>
    </div>
    <div class="back">
      <div class="row"><div class="label">বাংলা অর্থ</div><div class="bangla" id="bbangla"></div></div>
      <div class="row"><div class="label">Example Sentence</div><div class="value" id="bsent"></div></div>
      <div class="tip-box" id="btip"></div>
      <div class="row" style="margin-top:10px"><div class="label">Synonyms</div><div class="syn" id="bsyn"></div></div>
    </div>
  </div>
</div>
<div class="nav">
  <button id="prevBtn" onclick="navigate(-1)">← আগের</button>
  <button id="flipBtn" onclick="flipCard()">🔄 Flip</button>
  <button id="nextBtn" onclick="navigate(1)">পরের →</button>
</div>

<script>
const vocab=[
["SIGNIFICANT","সিগ-নিফ-ই-কেন্ট","গুরুত্বপূর্ণ / উল্লেখযোগ্য","There has been a significant increase in global temperatures.","💡 'Important'-এর বদলে এটা লিখুন, score বাড়বে!","considerable, substantial, notable, remarkable","Academic"],
["ENVIRONMENTAL","এন-ভাই-রন-মেন-টাল","পরিবেশগত","Environmental issues are a major global concern.","💡 Spelling: environ + mental (n ভুলবেন না!)","ecological, natural, green","Environment"],
["CONSEQUENTLY","কন-সি-কোয়েন্ট-লি","ফলস্বরূপ / এর ফলে","He didn't study. Consequently, he failed the exam.","💡 'So'-এর বদলে এটা লিখুন Writing-এ","therefore, thus, as a result, hence","Academic"],
["APPROXIMATELY","এপ-রক্স-ই-মেট-লি","প্রায় / আনুমানিক","Approximately 60% of people use smartphones daily.","💡 'About'-এর academic বিকল্প, Graph writing-এ অবশ্যই ব্যবহার করুন","roughly, around, nearly, almost","Academic"],
["DEMONSTRATE","ডেম-ন-স্ট্রেট","প্রমাণ করা / দেখানো","The graph demonstrates a steady rise in temperatures.","💡 'Show'-এর বদলে এটা লিখুন","illustrate, indicate, reveal, display","Academic"],
["GOVERNMENT","গাভ-আর্ন-মেন্ট","সরকার","The government should invest more in public education.","💡 Spelling trap: 'goverment' নয়, 'govern+ment'","administration, authority, state, regime","Society"],
["BENEFICIAL","বেন-ই-ফিশ-আল","উপকারী / সুফলদায়ক","Regular exercise is highly beneficial for mental health.","💡 'Good/useful'-এর বদলে এটা লিখুন","advantageous, helpful, useful, favorable","Academic"],
["MAJORITY","মা-জর-ই-টি","সংখ্যাগরিষ্ঠ / বেশিরভাগ","The majority of students prefer online learning.","💡 'Most people'-এর পরিবর্তে ব্যবহার করুন","most, bulk, mass, preponderance","Academic"],
["HOWEVER","হাউ-এভ-আর","তবে / কিন্তু","He worked hard. However, he didn't get the job.","💡 'But'-এর academic বিকল্প। Sentence শুরুতে ব্যবহার করুন।","nevertheless, yet, nonetheless, still","Linking"],
["ACCOMMODATE","আ-কম-ও-ডেট","থাকার ব্যবস্থা করা","The hotel can accommodate up to 200 guests.","💡 Spelling: ac+com+mo+date (দুটো c, দুটো m!)","house, host, contain, hold","General"],
["SUSTAINABLE","সাস-টেন-আ-বল","টেকসই / দীর্ঘস্থায়ী","We need sustainable energy solutions for the future.","💡 Environment topic-এ must-use word","renewable, viable, eco-friendly, long-term","Environment"],
["POLLUTION","পো-লু-শন","দূষণ","Air pollution is a serious problem in urban areas.","💡 Types: air, water, noise, soil pollution — সব জানুন","contamination, toxicity, impurity","Environment"],
["INNOVATION","ই-নো-ভেই-শন","উদ্ভাবন / নতুন আবিষ্কার","Technological innovation has transformed modern life.","💡 Technology topic-এর key word","invention, advancement, breakthrough, discovery","Technology"],
["FURTHERMORE","ফার-দার-মোর","আরও / এছাড়াও","Smoking is harmful. Furthermore, it is expensive.","💡 'Also/and also'-এর পরিবর্তে Writing-এ ব্যবহার করুন","moreover, additionally, in addition, besides","Linking"],
["NEVERTHELESS","নেভ-আর-দা-লেস","তবুও / তা সত্ত্বেও","The task was difficult. Nevertheless, she completed it.","💡 'But still'-এর sophisticated বিকল্প","however, yet, despite this, even so","Linking"],
["UNEMPLOYMENT","আন-এম-প্লয়-মেন্ট","বেকারত্ব","Youth unemployment is rising in many countries.","💡 Economy topic-এর core vocabulary","joblessness, redundancy, worklessness","Economy"],
["INFRASTRUCTURE","ইন-ফ্রা-স্ট্রাক-চার","অবকাঠামো","Poor infrastructure limits economic development.","💡 Urban planning ও development topic-এ key word","facilities, framework, network, system","Urban"],
["DIVERSE","ডাই-ভার্স","বৈচিত্র্যময়","Our society is becoming increasingly diverse.","💡 'Different'-এর পরিবর্তে ব্যবহার করুন","varied, mixed, multicultural, heterogeneous","Society"],
["EMPHASISE","এম-ফা-সাইজ","জোর দেওয়া / গুরুত্ব দেওয়া","Experts emphasise the importance of early education.","💡 American: emphasize, British: emphasise (IELTS British spelling prefer করে)","stress, highlight, underline, accentuate","Academic"],
["STATISTICS","স্ট্যা-টিস-টিক্স","পরিসংখ্যান","According to statistics, life expectancy has increased.","💡 Graph writing-এ অত্যন্ত জরুরি","data, figures, numbers, percentages","Academic"],
["GENERATE","জেন-আ-রেট","উৎপাদন করা / সৃষ্টি করা","Solar panels generate clean electricity.","💡 'Produce/create'-এর academic বিকল্প","produce, create, yield, develop","Academic"],
["IMPACT","ইম-প্যাক্ট","প্রভাব / প্রতিক্রিয়া","Climate change has a severe impact on biodiversity.","💡 'Effect'-এর শক্তিশালী বিকল্প","effect, influence, consequence, outcome","Academic"],
["ECONOMY","ই-কন-ও-মি","অর্থনীতি","The global economy is recovering slowly.","💡 'economic' (adj) ও 'economical' (মিতব্যয়ী) এর পার্থক্য জানুন","market, financial system, commerce","Economy"],
["ACADEMIC","অ্যাক-আ-ডেম-ইক","শিক্ষাগত / একাডেমিক","She has an impressive academic background.","💡 Noun form: academia; সঠিক spelling মনে রাখুন","scholarly, educational, intellectual","Education"],
["RESEARCH","রি-সার্চ","গবেষণা","Recent research shows that exercise reduces stress.","💡 'Studies show' ও 'Research indicates' — Writing-এ বারবার আসে","investigation, study, analysis, inquiry","Academic"],
["POPULATION","পপ-ইউ-লেই-শন","জনসংখ্যা","The world population is expected to reach 10 billion.","💡 Society ও environment topic-এর core word","inhabitants, residents, people, citizens","Society"],
["TECHNOLOGY","টেক-নল-ও-জি","প্রযুক্তি","Modern technology has changed the way we communicate.","💡 'technological' (adj) — সঠিক form ব্যবহার করুন","innovation, science, machinery, digital tools","Technology"],
["EFFICIENT","ই-ফিশ-এন্ট","দক্ষ / কার্যকর","Electric cars are more efficient than petrol vehicles.","💡 'Effective' (কার্যকর) vs 'Efficient' (সাশ্রয়ী ও দ্রুত) — পার্থক্য জানুন","effective, productive, capable, optimal","Academic"],
["GLOBAL","গ্লো-বাল","বৈশ্বিক / সারাবিশ্বব্যাপী","Global warming is one of the greatest challenges today.","💡 'Worldwide/international'-এর বদলে ব্যবহার করুন","worldwide, international, universal, planetary","Academic"],
["DECLINE","ডি-ক্লাইন","হ্রাস পাওয়া / কমে যাওয়া","There has been a sharp decline in bee populations.","💡 Graph writing-এ 'decrease/fall/drop'-এর সাথে এটাও শিখুন","decrease, fall, drop, reduction, downfall","Academic"]
];

let current=0,filtered=[...Array(vocab.length).keys()],isFlipped=false,ratings={};

function init(){
  const cats=[...new Set(vocab.map(v=>v[6]))];
  const sel=document.getElementById('catFilter');
  cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
  sel.onchange=()=>{
    const v=sel.value;
    filtered=v==='all'?[...Array(vocab.length).keys()]:vocab.reduce((a,w,i)=>w[6]===v?[...a,i]:a,[]);
    current=0;showCard();
  };
  showCard();
}

let _vocabAudio=null;
function playWord(){
  const word=vocab[filtered[current]]?.[0];
  if(!word) return;
  const btn=document.getElementById('soundBtn');
  if(_vocabAudio){_vocabAudio.pause();_vocabAudio=null;}
  const NEURAL_URL='https://relying-film-und-arrange.trycloudflare.com';
  const url=`${NEURAL_URL}/tts?text=${encodeURIComponent(word)}&voice=en-GB-SoniaNeural`;
  const audio=new Audio(url);
  _vocabAudio=audio;
  if(btn) btn.classList.add('playing');
  const done=()=>{_vocabAudio=null;if(btn){btn.classList.remove('playing');}};
  audio.onended=done;
  audio.onerror=()=>{
    done();
    if(window.speechSynthesis){
      const utt=new SpeechSynthesisUtterance(word);
      utt.lang='en-GB';utt.rate=0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utt);
    }
  };
  audio.play().catch(()=>{
    done();
    if(window.speechSynthesis){
      const utt=new SpeechSynthesisUtterance(word);
      utt.lang='en-GB';utt.rate=0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utt);
    }
  });
}

function showCard(){
  const idx=filtered[current];
  const v=vocab[idx];
  document.getElementById('fcat').textContent=v[6];
  document.getElementById('fword').textContent=v[0];
  document.getElementById('fpron').textContent='🔊 '+v[1];
  document.getElementById('bbangla').textContent=v[2];
  document.getElementById('bsent').textContent='"'+v[3]+'"';
  document.getElementById('btip').textContent=v[4];
  document.getElementById('bsyn').textContent='📝 Synonyms: '+v[5];
  document.getElementById('counter').textContent=`Card ${current+1} of ${filtered.length}`;
  const pct=(current+1)/filtered.length*100;
  document.getElementById('pbar').style.width=pct+'%';
  if(isFlipped){document.getElementById('card').classList.remove('flipped');isFlipped=false;}
  updateStars(ratings[idx]||0);
}

function flipCard(){
  document.getElementById('card').classList.toggle('flipped');
  isFlipped=!isFlipped;
}

function navigate(dir){
  current=(current+dir+filtered.length)%filtered.length;
  showCard();
}

function shuffle(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i],
["CONSERVATION","কন-সার-ভেই-শন","সংরক্ষণ","Conservation of natural resources is essential for future generations.","💡 Environment topic-এর must-use word","preservation, protection, maintenance","Environment"],
["MIGRATION","মাই-গ্রেই-শন","অভিবাসন / পরিযান","Economic migration has increased significantly in recent decades.","💡 Animal migration ও human migration দুটোই IELTS-এ আসে","movement, relocation, displacement, emigration","Society"],
["POVERTY","পভ-আর-টি","দারিদ্র্য","Poverty remains a major challenge in developing nations.","💡 'Poor people'-এর বদলে 'people living in poverty' লিখুন","deprivation, hardship, destitution","Society"],
["URBANISATION","আর-বান-আই-জেই-শন","নগরায়ন","Rapid urbanisation is putting pressure on city infrastructure.","💡 British spelling: urbanisation (z নয়, s দিয়ে)","city growth, metropolitan expansion","Urban"],
["INVESTMENT","ইন-ভেস্ট-মেন্ট","বিনিয়োগ","Foreign investment boosts economic development significantly.","💡 invest (v), investment (n), investor (n) সব form শিখুন","funding, capital, finance, expenditure","Economy"],
["INDICATE","ইন-ডি-কেট","ইঙ্গিত দেওয়া","The data indicates a steady rise in global temperatures.","💡 Graph writing-এ 'show'-এর পরিবর্তে এটা ব্যবহার করুন","show, suggest, demonstrate, reveal","Academic"],
["ALTHOUGH","অল-দো","যদিও","Although the task was difficult, she completed it on time.","💡 Contrast দেখাতে sentence শুরুতে ব্যবহার করুন","even though, despite the fact that, whilst","Linking"],
["CONTRIBUTE","কন-ট্রিব-ইউট","অবদান রাখা","Renewable energy can contribute to reducing carbon emissions.","💡 'contribute to + noun/gerund' - common IELTS structure","add to, play a role in, help, support","Academic"],
["CHALLENGE","চ্যাল-এন্জ","চ্যালেঞ্জ","Climate change is one of the greatest challenges facing humanity.","💡 'Problem'-এর বদলে 'challenge' লিখুন - more academic","difficulty, obstacle, problem, issue","Academic"],
["IMPLEMENT","ইম-প্লি-মেন্ট","বাস্তবায়ন করা","The government should implement stricter environmental regulations.","💡 'Do/apply'-এর academic বিকল্প","apply, enforce, carry out, execute","Academic"],
["WHEREAS","হোয়্যার-অ্যাজ","যেখানে / বিপরীতে","Men prefer outdoor activities, whereas women prefer indoor ones.","💡 Writing Task 1-এ দুটো বিপরীত তথ্য তুলনা করতে ব্যবহার করুন","while, but, in contrast, on the other hand","Linking"],
["ALTERNATIVE","অল-টার-না-টিভ","বিকল্প","Solar energy is a clean alternative to fossil fuels.","💡 'Option'-এর academic বিকল্প","option, substitute, replacement, choice","Academic"],

function rate(e,n){
